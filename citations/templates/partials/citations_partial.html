{% for citation in citations.object_list %}
<tr>
    <th><a href="{% url 'citations:citation' title=citation.title %}?version={{ citation.version }}">{{ citation.title }}</a></th>
    <th>{{ citation.version }}</th>
    <th><a href="{% url 'citations:party' pk=citation.primary.id %}">{{ citation.primary.fullname }}</a></th>
</tr>
{% endfor %}
{% if citations.has_next %}
<tr id="load-more-row">
    <td colspan="2">
        <button
        {% if all_versions %}
            hx-get="{% url 'citations:citations' %}?page={{ citations.next_page_number }}&legacy_versions=yes"
        {% else %}
            hx-get="{% url 'citations:citations' %}?page={{ citations.next_page_number }}"
        {% endif %}
            hx-target="#load-more-row"
            hx-swap="outerHTML"
        >
            Load More (Showing {{ pagination }} out of {{ total_results }} results)
        </button>
    </td>
</tr>
{% endif %}
