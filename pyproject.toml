[project]
name = "cmip7-citation-service"
version = "0.3.0"
description = "A citation service for the CMIP7 project"
authors = [
    {name = "Daniel Westwood",email = "daniel.westwood@stfc.ac.uk"}
]
license = "BSD 3"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (>=5.1.14,<6.0.0)",
    "xmltodict (>=1.0.2,<2.0.0)",
    "pycountry (>=24.6.1,<25.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "markdown (>=3.10,<4.0)",
    "django-filter (>=25.2,<26.0)",
    "fwtheme-django-ceda-serv @ git+https://github.com/cedadev/fwtheme-django-ceda-serv.git",
    "fwtheme-django @ git+https://github.com/cedadev/fwtheme-django.git",
    "django-flexi-settings @ git+https://github.com/cedadev/django-flexi-settings.git@0.1.3",
    "requests (>=2.32.5,<3.0.0)",
    "mozilla-django-oidc (>=5.0.2,<6.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "confluent-kafka (>=2.13.2,<3.0.0)",
    "django-allauth[socialaccount] (>=65.15.1,<66.0.0)",
    "slack-sdk (>=3.41.0,<4.0.0)",
    "esgf-core-utils (>=1.0.7,<2.0.0)",
    "esgvoc (>=4.0.0,<5.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    { include = 'citation_site' },
    { include = 'citations' }
]

[project.scripts]

[dependency-groups]
dev = [
    "ruff (>=0.15.11,<0.16.0)"
]
